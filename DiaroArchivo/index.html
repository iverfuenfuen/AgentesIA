<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Diario de Estudio</h1>

    <section class="streak" aria-live="polite">
      <span class="streak-label">Racha actual</span>
      <span id="streak-value" class="streak-value">0 días</span>
    </section>

    <form id="session-form" class="card" novalidate>
      <h2>Registrar sesión</h2>

      <label for="date">Fecha</label>
      <input type="date" id="date" required>

      <label for="topic">Tema</label>
      <input type="text" id="topic" placeholder="Ej: JavaScript, arrays" required>

      <label for="minutes">Minutos</label>
      <input type="number" id="minutes" min="1" step="1" inputmode="numeric" placeholder="Ej: 45" required>

      <p id="error" class="error" role="alert"></p>
      <button type="submit">Guardar sesión</button>
    </form>

    <section class="card">
      <h2>Mis sesiones</h2>
      <p id="empty" class="empty">Todavía no hay sesiones. ¡Registra la primera!</p>
      <ul id="session-list" class="session-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
